services:
  caddy:
    build: .
    container_name: caddy
    restart: always
    cap_add:
      - NET_ADMIN
    # network_mode: host
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - ./conf:/etc/caddy
      - caddy_config:/config
      - /srv/vogelbirb-homepage:/srv/vogelbirb-homepage
    hostname: caddy
    networks:
      web-net:
      # lan:
      #   ipv4_address: 192.168.1.50
    env_file: ".env"

volumes:
  caddy_data:
  caddy_config:
    
networks:
  web-net:
    external: true
